<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROYO STAYHUB - UP Stays</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');body{font-family:'Outfit',sans-serif;background:#FFF7ED}</style>
</head>
<body class="bg-[#FFF7ED]">
<div class="min-h-screen">
<header class="bg-white sticky top-0 z-50 border-b px-4 py-3 flex justify-between items-center">
<div class="flex items-center gap-2"><div class="w-8 h-8 bg-orange-600 rounded-lg flex items-center justify-center text-white font-black">R</div><span class="font-black">ROYO <span class="text-orange-600">STAYHUB</span></span></div>
<div class="flex gap-2"><button onclick="show('home')" class="px-3 py-1.5 bg-orange-600 text-white rounded-full text-xs font-bold">HOME</button><button onclick="show('owner')" class="px-3 py-1.5 border rounded-full text-xs font-bold">POST</button><button onclick="show('auth')" class="px-3 py-1.5 border rounded-full text-xs font-bold"><i class="fa-solid fa-user"></i></button></div>
</header>

<section id="auth" class="hidden p-4 max-w-md mx-auto"><div class="bg-white rounded-[24px] p-6 shadow mt-6"><h1 class="text-3xl font-black text-center">Welcome to<br><span class="text-orange-600">ROYO STAYHUB</span></h1><p class="text-center text-xs text-gray-500 mt-2">UP Students ke liye</p><input class="w-full mt-4 border-2 rounded-xl px-4 py-3 text-sm" placeholder="+91 Mobile"><div class="flex gap-2 mt-3 justify-center"><input class="w-10 h-12 border-2 rounded-xl text-center font-bold"><input class="w-10 h-12 border-2 rounded-xl text-center font-bold"><input class="w-10 h-12 border-2 rounded-xl text-center font-bold"><input class="w-10 h-12 border-2 rounded-xl text-center font-bold"><input class="w-10 h-12 border-2 rounded-xl text-center font-bold"><input class="w-10 h-12 border-2 rounded-xl text-center font-bold"></div><button onclick="show('home')" class="w-full bg-orange-600 text-white py-3 rounded-full font-black mt-4">Verify & Continue</button></div></section>

<section id="home" class="p-4 max-w-6xl mx-auto">
<div class="bg-gradient-to-r from-orange-600 to-red-500 rounded-[24px] p-6 text-white"><h2 class="text-2xl font-black">UP me Room dhoondo<br>District wise 🔍</h2><input id="searchInput" oninput="applyFilter()" class="w-full mt-4 rounded-full px-4 py-2 text-black text-sm outline-none" placeholder="Search Varanasi, Prayagraj, Lucknow..."></div>

<div class="flex gap-2 mt-4 overflow-x-auto pb-1">
<button data-dist="all" onclick="setDist(this)" class="dist-btn px-4 py-2 bg-black text-white rounded-full text-xs font-bold whitespace-nowrap">All UP</button>
<button data-dist="varanasi" onclick="setDist(this)" class="dist-btn px-4 py-2 bg-white border rounded-full text-xs font-bold whitespace-nowrap">Varanasi</button>
<button data-dist="prayagraj" onclick="setDist(this)" class="dist-btn px-4 py-2 bg-white border rounded-full text-xs font-bold whitespace-nowrap">Prayagraj</button>
<button data-dist="lucknow" onclick="setDist(this)" class="dist-btn px-4 py-2 bg-white border rounded-full text-xs font-bold whitespace-nowrap">Lucknow</button>
<button data-dist="kanpur" onclick="setDist(this)" class="dist-btn px-4 py-2 bg-white border rounded-full text-xs font-bold whitespace-nowrap">Kanpur</button>
</div>

<div class="flex gap-2 mt-3 overflow-x-auto pb-2">
<button data-cat="all" onclick="setCat(this)" class="cat-btn px-4 py-1.5 bg-orange-600 text-white rounded-full text-xs font-bold whitespace-nowrap">🏠 All</button>
<button data-cat="room" onclick="setCat(this)" class="cat-btn px-4 py-1.5 bg-white border rounded-full text-xs font-bold whitespace-nowrap">🏠 Room</button>
<button data-cat="pg" onclick="setCat(this)" class="cat-btn px-4 py-1.5 bg-white border rounded-full text-xs font-bold whitespace-nowrap">🏢 PG</button>
<button data-cat="hostel" onclick="setCat(this)" class="cat-btn px-4 py-1.5 bg-white border rounded-full text-xs font-bold whitespace-nowrap">🎓 Hostel</button>
<button data-cat="flat" onclick="setCat(this)" class="cat-btn px-4 py-1.5 bg-white border rounded-full text-xs font-bold whitespace-nowrap">🏘️ Flat</button>
</div>

<h3 class="font-black mt-6 mb-3">🔥 <span id="resultCount">0</span> Live Stays - Firebase Connected ✅</h3>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="stayGrid">
<p class="col-span-3 text-center text-sm text-gray-400 py-10">Loading properties from Firebase... ⏳</p>
</div>
</section>

<section id="owner" class="hidden p-4 max-w-xl mx-auto">
<div class="bg-white rounded-[24px] p-6 shadow mt-4">
<h2 class="text-xl font-black">Post Property - Sabke Phone Me Dikhega 🚀</h2>
<div class="grid grid-cols-2 gap-3 mt-4">
<select id="pType" class="border-2 rounded-xl px-3 py-3 text-sm"><option value="room">Room</option><option value="pg">PG</option><option value="hostel">Hostel</option><option value="flat">Flat</option></select>
<select id="pDist" class="border-2 rounded-xl px-3 py-3 text-sm"><option value="varanasi">Varanasi</option><option value="prayagraj">Prayagraj</option><option value="lucknow">Lucknow</option><option value="kanpur">Kanpur</option></select>
<input id="pCity" class="border-2 rounded-xl px-3 py-3 text-sm" placeholder="City">
<input id="pArea" class="border-2 rounded-xl px-3 py-3 text-sm" placeholder="Area - e.g. Lanka">
<input id="pRent" class="border-2 rounded-xl px-3 py-3 text-sm" placeholder="Rent - 6500">
<input id="pPhone" class="border-2 rounded-xl px-3 py-3 text-sm" placeholder="Phone">
<input id="pTitle" class="col-span-2 border-2 rounded-xl px-3 py-3 text-sm" placeholder="Title - BHU ke paas 1RK">
</div>
<button onclick="postProperty()" id="postBtn" class="w-full bg-orange-600 text-white py-3 rounded-full font-black mt-6">🚀 Post Now - Live Hoga</button>
<p id="postStatus" class="text-xs text-center mt-2"></p>
</div>
</section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDpR-ydEQWVCylOpJtOEbxrR9WnkuGErsk",
  authDomain: "royo-stayhub.firebaseapp.com",
  projectId: "royo-stayhub",
  storageBucket: "royo-stayhub.firebasestorage.app",
  messagingSenderId: "1028107929716",
  appId: "1:1028107929716:web:63286045ad3911f60de921"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let curDist='all', curCat='all';
window.show = (id)=>{document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden'); window.scrollTo(0,0);}
window.setDist = (btn)=>{curDist=btn.dataset.dist; document.querySelectorAll('.dist-btn').forEach(b=>b.className='dist-btn px-4 py-2 bg-white border rounded-full text-xs font-bold whitespace-nowrap'); btn.className='dist-btn px-4 py-2 bg-black text-white rounded-full text-xs font-bold whitespace-nowrap'; applyFilter();}
window.setCat = (btn)=>{curCat=btn.dataset.cat; document.querySelectorAll('.cat-btn').forEach(b=>b.className='cat-btn px-4 py-1.5 bg-white border rounded-full text-xs font-bold whitespace-nowrap'); btn.className='cat-btn px-4 py-1.5 bg-orange-600 text-white rounded-full text-xs font-bold whitespace-nowrap'; applyFilter();}
window.applyFilter = ()=>{
 const search=document.getElementById('searchInput').value.toLowerCase();
 let count=0;
 document.querySelectorAll('.stay-card').forEach(card=>{
  const d=card.dataset.dist, c=card.dataset.cat, t=card.dataset.title;
  const matchDist = curDist==='all' || d===curDist;
  const matchCat = curCat==='all' || c===curCat;
  const matchSearch =!search || t.includes(search) || d.includes(search);
  if(matchDist && matchCat && matchSearch){card.style.display=''; count++;} else {card.style.display='none';}
 });
 document.getElementById('resultCount').innerText=count;
}
onSnapshot(collection(db, "properties"), (snapshot)=>{
 const grid=document.getElementById('stayGrid');
 grid.innerHTML="";
 if(snapshot.empty){grid.innerHTML='<p class="col-span-3 text-center py-10 text-sm text-gray-400">No properties yet. Be first to post! 🏠</p>'; document.getElementById('resultCount').innerText=0; return;}
 snapshot.forEach(doc=>{
  const p=doc.data();
  grid.innerHTML+=`
  <div class="stay-card bg-white rounded-[20px] overflow-hidden shadow" data-dist="${p.district}" data-cat="${p.type}" data-title="${(p.title+' '+p.area+' '+p.district).toLowerCase()}">
  <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=500" class="h-40 w-full object-cover">
  <div class="p-4"><div class="flex justify-between"><h4 class="font-bold text-sm">${p.title}</h4><span class="text-orange-600 font-black text-sm">₹${p.rent}</span></div>
  <p class="text-xs text-gray-500 mt-1">${p.area}, ${p.city} • ${p.district} • ${p.type}</p>
  <a href="tel:${p.phone}" class="block text-center w-full mt-3 bg-black text-white rounded-full py-2 text-xs font-black">📞 ${p.phone} - Call</a></div></div>`;
 });
 applyFilter();
});
window.postProperty = async ()=>{
 const title=document.getElementById('pTitle').value;
 const phone=document.getElementById('pPhone').value;
 if(!title ||!phone){alert("Title aur Phone bharo!"); return;}
 const btn=document.getElementById('postBtn');
 btn.innerText="Posting to Firebase..."; btn.disabled=true;
 try{
  await addDoc(collection(db, "properties"), {
   type: document.getElementById('pType').value,
   district: document.getElementById('pDist').value,
   city: document.getElementById('pCity').value || document.getElementById('pDist').value,
   area: document.getElementById('pArea').value || "UP",
   rent: document.getElementById('pRent').value || "5000",
   phone: phone,
   title: title,
   createdAt: new Date()
  });
  document.getElementById('postStatus').innerText="✅ Live! Sabke phone me dikh raha hai";
  document.getElementById('pTitle').value=""; document.getElementById('pPhone').value="";
  setTimeout(()=>show('home'), 800);
 }catch(e){alert("Firestore Error: "+e.message);}
 btn.innerText="🚀 Post Now - Live Hoga"; btn.disabled=false;
}
show('home');
</script>
</body>
</html>
